<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lumen Desktop · Golden Gate Inspired Mock</title>
  <meta name="description" content="Entertainment browser mock of a modern Liquid Glass desktop OS. Not macOS, not Apple. Original assets only." />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/boot.css" />
  <link rel="stylesheet" href="css/desktop.css" />
  <link rel="stylesheet" href="css/windows.css" />
  <link rel="stylesheet" href="css/glass68.css" />
  <link rel="stylesheet" href="css/lumen81.css" />
  <link rel="stylesheet" href="css/lumen82.css" />
  <link rel="stylesheet" href="css/lumen88.css" />
  <link rel="stylesheet" href="css/lumen90.css" />
  <link rel="stylesheet" href="css/extras.css" />
  <style>
    /* Enhanced Liquid Glass for Lumen mock */
    .glass, .dock, .menu-bar, .window, .win, .control-center, .assistant, .launchpad, .spotlight, .notify {
      backdrop-filter: blur(120px) saturate(400%) brightness(1.25);
      -webkit-backdrop-filter: blur(120px) saturate(400%) brightness(1.25);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 50px 120px rgba(0,0,0,0.6), inset 0 4px 0 rgba(255,255,255,0.95), inset 0 -5px 0 rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.2);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .icon { transition: transform 0.4s cubic-bezier(0.15,1,0.3,1), filter 0.4s; }
    .dock .dock-item:hover { transform: scale(1.9) translateY(-40px); filter: brightness(1.4) drop-shadow(0 18px 36px rgba(0,0,0,0.55)); }
    .glass-icon .spec { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, transparent 30%, transparent 70%, rgba(255,255,255,0.25) 100%); pointer-events: none; }
    .glass-icon .highlight { position: absolute; top: 2%; left: 6%; width: 50%; height: 30%; border-radius: 50%; background: rgba(255,255,255,0.85); filter: blur(6px); pointer-events: none; }
    .menu-bar { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 14px; color: #f8fafc; letter-spacing: 0.01em; font-weight: 500; }
    .wallpaper { background: url('assets/ridge-dawn.jpg') center/cover no-repeat, linear-gradient(180deg, #1e3a5f 0%, #0f172a 100%); animation: wallshift 40s ease-in-out infinite alternate; }
    @keyframes wallshift { to { filter: hue-rotate(6deg) saturate(1.1) brightness(1.05); } }
    .dock { border-radius: 40px; padding: 12px 18px 14px; }
    .window, .win { border-radius: 22px; }
    .assistant { border-radius: 28px; }
  </style>
</head>
<body>
  <!-- Boot screen with tiny LLM load -->
  <div id="boot-screen" class="boot">
    <div class="boot-logo">Lumen</div>
    <div class="boot-bar"><div id="boot-fill" class="boot-fill"></div></div>
    <div id="boot-status">Initializing Lumen shell…</div>
  </div>

  <!-- Lock screen -->
  <div id="lock-screen" class="lock hidden">
    <div id="lock-time" class="lock-time">12:00</div>
    <div id="lock-date" class="lock-date">Wednesday</div>
    <button id="unlock-btn" class="unlock">Unlock</button>
  </div>

  <!-- Main desktop -->
  <div id="desktop" class="desktop hidden">
    <div id="wallpaper" class="wallpaper"></div>

    <!-- Menu bar -->
    <div class="menu-bar glass">
      <div class="menu-left">
        <span id="lumen-menu">Lumen</span>
        <span class="menu-item" data-menu="file">File</span>
        <span class="menu-item" data-menu="edit">Edit</span>
        <span class="menu-item" data-menu="view">View</span>
        <span class="menu-item" data-menu="go">Go</span>
        <span class="menu-item" data-menu="window">Window</span>
        <span class="menu-item" data-menu="help">Help</span>
      </div>
      <div class="menu-right">
        <span id="cc-toggle">◉</span>
        <span id="notify-toggle">🔔</span>
        <span id="clock">12:00</span>
      </div>
    </div>
    <div id="menu-pop" class="menu-pop hidden"></div>

    <!-- Widgets -->
    <div id="widgets" class="glass">
      <div id="wid-clock" class="wid-clock">12:00</div>
      <div class="wid-weather">Clear · 72°</div>
      <div class="wid-hint">⌘Space Aura · F4 Launchpad</div>
    </div>

    <!-- Desktop icons -->
    <div id="desk-icons" class="desk-icons"></div>

    <!-- Dock -->
    <div id="dock" class="dock glass"></div>

    <!-- Control Center -->
    <div id="control-center" class="control-center glass hidden">
      <div class="cc-tile">Wi-Fi</div>
      <div class="cc-tile">Bluetooth</div>
      <div class="cc-tile">Focus</div>
      <label>Brightness <input id="bright" type="range" min="50" max="130" value="100"></label>
      <label>Glass intensity <input id="tint" type="range" min="0" max="1" step="0.05" value="0.5"></label>
    </div>

    <!-- Notifications -->
    <div id="notify-drawer" class="notify glass hidden"></div>

    <!-- Spotlight / Aura search -->
    <div id="spotlight" class="spotlight glass hidden">
      <input id="spot-input" placeholder="Search or ask Aura…" />
      <div id="spot-results"></div>
    </div>

    <!-- Launchpad -->
    <div id="launchpad" class="launchpad hidden">
      <input id="lp-search" placeholder="Search apps" />
      <div id="lp-grid"></div>
    </div>

    <!-- Mission Control -->
    <div id="mission" class="mission hidden"></div>

    <!-- Windows container -->
    <div id="windows" class="windows"></div>

    <!-- Aura / mock Siri -->
    <div id="assistant" class="assistant glass hidden">
      <div class="aura-header">
        <span>Aura</span>
        <button id="close-aura">✕</button>
      </div>
      <div id="aura-log" class="aura-log"></div>
      <form id="aura-form">
        <input id="aura-input" placeholder="Ask Aura…" autocomplete="off" />
        <button type="button" id="aura-mic">🎤</button>
        <button type="submit">→</button>
      </form>
      <div id="aura-mode" class="small">Local + optional AI</div>
    </div>

    <!-- Context menu -->
    <div id="ctx" class="ctx hidden"></div>
    <div id="toast" class="toast glass hidden"></div>
  </div>

  <!-- Core scripts -->
  <script src="js/model.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/mind.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/enhance.js"></script>
  <script src="js/windows.js"></script>
  <!-- Additional feature modules -->
  <script src="js/gate27.js"></script>
  <script src="js/glass68.js"></script>
  <script src="js/golden.js"></script>
  <script src="js/lumen59.js"></script>
  <script src="js/lumen70.js"></script>
</body>
</html>
