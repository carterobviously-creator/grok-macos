<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lumen Desktop · Entertainment Mock</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/boot.css" />
  <link rel="stylesheet" href="css/desktop.css" />
  <link rel="stylesheet" href="css/windows.css" />
  <link rel="stylesheet" href="css/glass68.css" />
  <link rel="stylesheet" href="css/extras.css" />
  <style>
    /* Enhanced Liquid Glass refinements for Lumen 79 */
    .glass, .dock, .menu-bar, .window, .control-center, .assistant, .launchpad {
      backdrop-filter: blur(40px) saturate(220%) brightness(1.05);
      -webkit-backdrop-filter: blur(40px) saturate(220%) brightness(1.05);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 12px 40px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(0,0,0,0.1);
    }
    .icon { transition: transform 0.18s cubic-bezier(0.2,0.85,0.2,1), filter 0.2s; }
    .dock .icon:hover { transform: scale(1.32) translateY(-12px); filter: brightness(1.1); }
    .glass-icon .spec { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, transparent 50%); pointer-events: none; }
    .glass-icon .highlight { position: absolute; top: 4%; left: 8%; width: 40%; height: 25%; border-radius: 50%; background: rgba(255,255,255,0.35); filter: blur(4px); pointer-events: none; }
    #wallpaper { background: url('assets/ridge-dawn.jpg') center/cover no-repeat fixed; }
  </style>
</head>
<body>
  <!-- Boot screen with tiny LLM load -->
  <div id="boot-screen" class="boot">
    <div class="boot-logo">Lumen</div>
    <div class="boot-bar"><div id="boot-fill" class="boot-fill"></div></div>
    <div id="boot-status">Starting…</div>
  </div>

  <!-- Lock screen -->
  <div id="lock-screen" class="lock hidden">
    <div id="lock-time" class="lock-time">12:00</div>
    <div id="lock-date" class="lock-date">Wednesday</div>
    <button id="unlock-btn" class="unlock">Unlock</button>
  </div>

  <!-- Main desktop -->
  <div id="desktop" class="desktop hidden">
    <div id="wallpaper" class="wallpaper"></div>

    <!-- Menu bar -->
    <div class="menu-bar glass">
      <div class="menu-left">
        <span id="lumen-menu">Lumen</span>
        <span class="menu-item" data-menu="file">File</span>
        <span class="menu-item" data-menu="edit">Edit</span>
        <span class="menu-item" data-menu="view">View</span>
        <span class="menu-item" data-menu="go">Go</span>
        <span class="menu-item" data-menu="window">Window</span>
        <span class="menu-item" data-menu="help">Help</span>
      </div>
      <div class="menu-right">
        <span id="cc-toggle">◉</span>
        <span id="notify-toggle">🔔</span>
        <span id="clock">12:00</span>
      </div>
    </div>
    <div id="menu-pop" class="menu-pop hidden"></div>

    <!-- Desktop icons -->
    <div id="desk-icons" class="desk-icons"></div>

    <!-- Dock -->
    <div id="dock" class="dock glass"></div>

    <!-- Control Center -->
    <div id="control-center" class="control-center glass hidden">
      <div class="cc-tile">Wi-Fi</div>
      <div class="cc-tile">Bluetooth</div>
      <div class="cc-tile">Focus</div>
      <label>Brightness <input id="bright" type="range" min="50" max="130" value="100"></label>
      <label>Glass intensity <input id="tint" type="range" min="0" max="1" step="0.05" value="0.5"></label>
    </div>

    <!-- Notifications -->
    <div id="notify-drawer" class="notify glass hidden"></div>

    <!-- Spotlight / Siri search -->
    <div id="spotlight" class="spotlight glass hidden">
      <input id="spot-input" placeholder="Search or ask Aura…" />
      <div id="spot-results"></div>
    </div>

    <!-- Launchpad -->
    <div id="launchpad" class="launchpad hidden">
      <input id="lp-search" placeholder="Search apps" />
      <div id="lp-grid"></div>
    </div>

    <!-- Mission Control -->
    <div id="mission" class="mission hidden"></div>

    <!-- Windows container -->
    <div id="windows" class="windows"></div>

    <!-- Aura / mock Siri -->
    <div id="assistant" class="assistant glass hidden">
      <div class="aura-header">
        <span>Aura</span>
        <button id="close-aura">✕</button>
      </div>
      <div id="aura-log" class="aura-log"></div>
      <form id="aura-form">
        <input id="aura-input" placeholder="Ask Aura…" autocomplete="off" />
        <button type="button" id="aura-mic">🎤</button>
        <button type="submit">→</button>
      </form>
      <div id="aura-mode" class="small">Local + optional AI</div>
    </div>

    <!-- Context menu -->
    <div id="ctx" class="ctx hidden"></div>
  </div>

  <!-- Core scripts -->
  <script src="js/model.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/mind.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/enhance.js"></script>
  <!-- Additional feature modules -->
  <script src="js/gate27.js"></script>
  <script src="js/glass68.js"></script>
  <script src="js/golden.js"></script>
  <script src="js/lumen59.js"></script>
  <script src="js/lumen70.js"></script>
</body>
</html>
