<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok macOS Simulator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 24 24" width="72" height="72" fill="white">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
    </div>
    <div class="boot-progress"><div class="boot-bar"></div></div>
    <p class="boot-text">Grok macOS · loading tiny LLM</p>
  </div>

  <div id="desktop" class="hidden">
    <div id="menu-bar">
      <div class="menu-left">
        <span class="apple-menu">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        </span>
        <span class="menu-item active">Finder</span>
        <span class="menu-item">File</span>
        <span class="menu-item">Edit</span>
        <span class="menu-item">View</span>
        <span class="menu-item">Go</span>
        <span class="menu-item">Window</span>
        <span class="menu-item">Help</span>
      </div>
      <div class="menu-right">
        <span class="status-icon" id="wifi" title="Wi-Fi">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-4.2-2.8l1.4 1.4C10.1 15.6 11 15.3 12 15.3s1.9.3 2.8.9l1.4-1.4C14.9 13.8 13.5 13.3 12 13.3s-2.9.5-4.2 1.9zM3.5 9.5l1.4 1.4C7.1 8.7 9.4 8 12 8s4.9.7 7.1 2.9l1.4-1.4C17.9 6.9 15.1 6 12 6S6.1 6.9 3.5 9.5z"/></svg>
        </span>
        <span class="status-icon" id="battery">100%</span>
        <span class="status-icon" id="clock"></span>
        <span class="status-icon siri-btn" id="siri-btn" title="Siri">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" opacity=".25"/><circle cx="12" cy="12" r="5"/></svg>
        </span>
      </div>
    </div>

    <div id="wallpaper"></div>
    <div id="windows-container"></div>

    <div id="dock">
      <div class="dock-item" data-app="finder" title="Finder">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5AC8FA"/><stop offset="100%" stop-color="#007AFF"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#fg)"/><path d="M18 22h28v6H18zm0 12h20v6H18z" fill="#fff" opacity=".9"/></svg>
        </div>
      </div>
      <div class="dock-item" data-app="safari" title="Safari">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34C759"/><stop offset="100%" stop-color="#30B0C7"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#sg)"/><circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="3"/><path d="M32 14l4 18-4 18-4-18z" fill="#fff" opacity=".95"/></svg>
        </div>
      </div>
      <div class="dock-item" data-app="messages" title="Messages">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#30D158"/><stop offset="100%" stop-color="#34C759"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#mg)"/><path d="M16 20c0-4 4-8 16-8s16 4 16 8v12c0 4-4 8-16 8H20l-4 6v-6c-4 0-8-4-8-8V20z" fill="#fff"/></svg>
        </div>
      </div>
      <div class="dock-item" data-app="mail" title="Mail">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="mlg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5AC8FA"/><stop offset="100%" stop-color="#007AFF"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#mlg)"/><path d="M12 20h40v24H12z" fill="none" stroke="#fff" stroke-width="3"/><path d="M12 20l20 14 20-14" fill="none" stroke="#fff" stroke-width="3"/></svg>
        </div>
      </div>
      <div class="dock-item" data-app="photos" title="Photos">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF2D55"/><stop offset="50%" stop-color="#FF9500"/><stop offset="100%" stop-color="#FFCC00"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#pg)"/><circle cx="24" cy="24" r="8" fill="#fff" opacity=".9"/><circle cx="40" cy="40" r="10" fill="#fff" opacity=".7"/></svg>
        </div>
      </div>
      <div class="dock-item" data-app="music" title="Music">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="mug" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF2D55"/><stop offset="100%" stop-color="#FF375F"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#mug)"/><path d="M24 16v28a8 8 0 1 0 4-6.5V24l20-4v16a8 8 0 1 0 4-6.5V12z" fill="#fff"/></svg>
        </div>
      </div>
      <div class="dock-item" data-app="notes" title="Notes">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFCC00"/><stop offset="100%" stop-color="#FF9500"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#ng)"/><path d="M18 18h28v4H18zm0 10h28v4H18zm0 10h20v4H18z" fill="#fff" opacity=".9"/></svg>
        </div>
      </div>
      <div class="dock-item" data-app="calendar" title="Calendar">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><rect width="64" height="64" rx="14" fill="#FF3B30"/><rect y="18" width="64" height="46" rx="0" fill="#fff"/><text x="32" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#1c1c1e">5</text></svg>
        </div>
      </div>
      <div class="dock-item" data-app="settings" title="System Settings">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="stg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8E8E93"/><stop offset="100%" stop-color="#636366"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#stg)"/><circle cx="32" cy="32" r="10" fill="none" stroke="#fff" stroke-width="4"/><circle cx="32" cy="32" r="4" fill="#fff"/></svg>
        </div>
      </div>
      <div class="dock-separator"></div>
      <div class="dock-item" data-app="trash" title="Trash">
        <div class="dock-icon">
          <svg viewBox="0 0 64 64" width="48" height="48"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8E8E93"/><stop offset="100%" stop-color="#48484A"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#tg)"/><path d="M20 22h24l-2 28H22z" fill="#fff" opacity=".85"/><path d="M18 18h28v4H18z" fill="#fff"/></svg>
        </div>
      </div>
    </div>

    <div id="siri-panel" class="hidden">
      <div class="siri-header">Siri</div>
      <div id="siri-chat"></div>
      <div class="siri-input-row">
        <input type="text" id="siri-input" placeholder="Ask Siri..." autocomplete="off">
        <button id="siri-send">Ask</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
