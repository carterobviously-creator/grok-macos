<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen Gallery</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/glass68.css" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    a { color: #7dd3fc; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    article { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 14px; }
    button { border: 0; border-radius: 999px; padding: 6px 12px; background: #38bdf8; color: #0f172a; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p><a href="../index.html">Back to desktop</a></p>
    <h1>Gallery</h1>
    <p>Local catalog for the entertainment desktop. Nothing here is sold, and nothing is an Apple app.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const apps = ["Notes","Calc","Web","Calendar","Music","Photos","Mail","Maps","Weather","Reminders","Sketch","Terminal"];
    const grid = document.getElementById("grid");
    grid.innerHTML = apps.map((name) =>
      '<article><h3>' + name + '</h3><p>Opens inside the desktop mock.</p><button data-n="' + name + '">Get</button></article>'
    ).join("");
    grid.querySelectorAll("button").forEach((b) => {
      b.onclick = () => {
        const have = JSON.parse(localStorage.getItem("lumen-gallery") || "[]");
        if (!have.includes(b.dataset.n)) have.push(b.dataset.n);
        localStorage.setItem("lumen-gallery", JSON.stringify(have));
        b.textContent = "Added";
      };
    });
  </script>
</body>
</html>
