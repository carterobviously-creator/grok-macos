<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen Gallery</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/lumen61.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    main { max-width: 880px; margin: 40px auto; padding: 0 20px; }
    a { color: #7dd3fc; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Lumen Gallery</h1>
    <p>Entertainment catalog for the desktop mock. Opens inside the main desk when you click Get there.</p>
    <p><a href="../index.html">Back to desktop</a></p>
    <div class="grid" id="grid"></div>
  </main>
  <script src="gallery.js"></script>
</body>
</html>
